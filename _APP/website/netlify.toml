[build]
  command = "npm run build"
  publish = "_site"
  # No deploy previews or branch deploys (Ryan reviews changes locally on
  # localhost:8081). Exit 0 = skip the build, exit 1 = build. Only production
  # (pushes to main) builds and goes live.
  ignore = 'if [ "$CONTEXT" = "production" ]; then exit 1; else exit 0; fi'

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
